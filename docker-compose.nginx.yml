version: '3.8'

services:
  # Nginx Proxy Server (Port 5500)
  nginx:
    image: nginx:1.25-alpine
    container_name: websystem_nginx
    ports:
      - "5500:5500"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - postgres
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - websystem_network

  # PostgreSQL Database (Optional - for production-like setup)
  postgres:
    image: postgres:16-alpine
    container_name: websystem_db
    environment:
      POSTGRES_DB: business_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - websystem_network

  # Backend Django (Optional Docker container - can run host-based)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   container_name: websystem_backend
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/business_system
  #     USE_SQLITE: "false"
  #     DJANGO_SETTINGS_MODULE: business_system.settings
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app/backend
  #   networks:
  #     - websystem_network

volumes:
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  websystem_network:
    driver: bridge